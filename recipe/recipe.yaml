schema_version: 1

context:
  # dev track: upstream main at a pinned SHA. `.dev<commit date>` sorts below the
  # next release (0.36.0.dev20260929 < 0.36.0), so the 0.36.0 package supersedes it.
  version: "0.36.0.dev20261103"
  upstream_sha: "2b79e91c8097579b01d66cca74015ad127abb339"

package:
  name: tesseract-robotics
  version: ${{ version }}

source:
  - url: https://github.com/tesseract-robotics/tesseract/archive/${{ upstream_sha }}.tar.gz
    sha256: 862dc056e35f2d0da1d323d3cfed7b327967f0d7cf1352a09c03408a54086ba1
    file_name: source.tar.gz

build:
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - benchmark
    - gtest
    - gmock
    - cmake
    - ninja
    - pkg-config
    - lcov
    - if: win
      then: m2-patch
      else: patch
    - if: linux
      then:
        - ${{ cdt('mesa-libgl-devel') }}
        - ${{ cdt('mesa-dri-drivers') }}
  host:
    - ros-industrial-cmake-boilerplate
    - boost-plugin-loader
    - opw-kinematics
    - libboost-devel
    - cereal
    - eigen-abi-devel
    - tinyxml2
    - spdlog
    - assimp
    - urdfdom
    - fcl
    - octomap 
    - orocos-kdl 
    - pcl
    - gtest
    - gmock
    - pkg-config 
    - xz
    - flann
    - jsoncpp
    - yaml-cpp
    - bullet-cpp
    - blas
    - if: unix
      then:
        - xorg-libx11
        - xorg-libxext
  run:
    - cereal
    - eigen
    - tinyxml2
    - spdlog
    - assimp
    - urdfdom
    - fcl
    - octomap 
    - orocos-kdl 
    - pcl
    - xz
    - yaml-cpp
    - bullet-cpp
    - blas
    - if: unix
      then:
        - xorg-libx11
        - xorg-libxext
  run_exports:
    - ${{ pin_subpackage('tesseract-robotics', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - tesseract/collision/common.h
        - tesseract/common/fwd.h
        - tesseract/environment/fwd.h
        - tesseract/geometry/fwd.h
        - tesseract/kinematics/fwd.h
        - tesseract/scene_graph/fwd.h
        - tesseract/srdf/fwd.h
        - tesseract/state_solver/fwd.h
        - tesseract/urdf/urdf_parser.h
        - tesseract/visualization/fwd.h
      lib:
        - tesseract_collision
        - tesseract_common
        - tesseract_environment
        - tesseract_scene_graph
        - tesseract_srdf
        - tesseract_urdf
        - tesseract_visualization

about:
  summary: Motion Planning Environment
  license: Apache-2.0 AND BSD-3-Clause AND BSD-2-Clause
  license_file:
    - src/LICENSE
    - src/LICENSE.Apache-2.0
    - src/LICENSE.BSD-3-Clause
    - src/LICENSE.BSD-2-Clause
  homepage: https://github.com/tesseract-robotics/tesseract

extra:
  recipe-maintainers:
    - johnwason
    - Levi-Armstrong
    - traversaro

